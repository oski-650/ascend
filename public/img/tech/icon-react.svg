<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" x="0px" y="0px"
  width="120px" height="90px" viewBox="0 0 120 90">
  <!-- Center dot -->
  <circle cx="60" cy="45" r="6.5" fill="#61DAFB"/>
  <!-- Three orbiting ellipses at 0°, 60°, 120° -->
  <ellipse cx="60" cy="45" rx="40" ry="15"
    fill="none" stroke="#61DAFB" stroke-width="3.5"/>
  <ellipse cx="60" cy="45" rx="40" ry="15"
    fill="none" stroke="#61DAFB" stroke-width="3.5"
    transform="rotate(60 60 45)"/>
  <ellipse cx="60" cy="45" rx="40" ry="15"
    fill="none" stroke="#61DAFB" stroke-width="3.5"
    transform="rotate(120 60 45)"/>
</svg>
